name: LearnHarness Papers AppImage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run papers:appimage
      - uses: actions/upload-artifact@v6
        with:
          name: LearnHarness-Papers-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
